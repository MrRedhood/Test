<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevForge | Neural IDE</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="splash-screen">
        <div class="splash-content">
            <h1>DEVFORGE</h1>
            <div class="loader"></div>
            <p>SYNCING NEURAL KERNEL...</p>
        </div>
    </div>

    <div id="ide-container" class="hidden">
        <header id="top-bar">
            <div class="logo">DEVFORGE</div>
            <div class="window-controls">
                <button class="ctrl red"></button>
                <button class="ctrl yellow"></button>
                <button class="ctrl green"></button>
            </div>
        </header>

        <div id="main-layout">
            <aside id="activity-bar">
                <button class="active" onclick="console.log('Explorer')">📂</button>
                <button onclick="console.log('Search')">🔍</button>
                <button onclick="console.log('Git')">⎇</button>
                <button onclick="console.log('Debug')">⚡</button>
            </aside>

            <main id="editor-pane">
                <div class="editor-header">WORKSPACE_CONTROLLER.JS</div>
                <div id="code-canvas"></div>
            </main>

            <section id="terminal-pane">
                <div class="term-header">SYSTEM_LOGS</div>
                <div id="terminal-output"></div>
            </section>
        </div>

        <footer id="status-bar">
            <div id="sync-indicator">● SYSTEM_READY</div>
            <div id="device-tag">ANDROID_VIRTUAL_DEVICE_01</div>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
