<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevForge // Neural IDE</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="splash-screen">
        <div class="loader"></div>
        <h1 class="glitch" data-text="DEVFORGE">DEVFORGE</h1>
        <p>INITIALIZING NEURAL KERNEL...</p>
    </div>

    <div id="ide-container" class="hidden">
        <header id="top-bar">
            <div class="logo">DEVFORGE // CORE</div>
            <div class="controls">
                <button class="btn-ctrl" onclick="alert('Feature: Minimizing to System Tray')">—</button>
                <button class="btn-ctrl" onclick="alert('Feature: Maximizing Workspace')">□</button>
                <button class="btn-ctrl close-app" onclick="location.reload()">✕</button>
            </div>
        </header>

        <div id="main-layout">
            <aside id="activity-bar">
                <button class="active" onclick="renderView('explorer')">📂</button>
                <button onclick="renderView('search')">🔍</button>
                <button onclick="renderView('git')">⎇</button>
                <button onclick="renderView('debug')">⚡</button>
                <button class="bottom-fixed" onclick="alert('Android Logcat Active')">🤖</button>
            </aside>

            <section id="work-area">
                <div id="editor-tabs">
                    <div class="tab active">WORKSPACE_CTRL.js</div>
                </div>
                <div id="code-editor">// Neural engine ready...
// Waiting for input...</div>
            </section>

            <section id="side-pane">
                <div class="pane-title">PROPERTIES</div>
                <div class="pane-content" id="prop-view">Select an object to view parameters.</div>
            </section>
        </div>

        <footer id="status-bar">
            <div class="status-item">● READY</div>
            <div class="status-item">AVD_PIXEL_6_API33</div>
            <div class="status-item">BUILD: SUCCESSFUL</div>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
