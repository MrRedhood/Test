<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #050505; color: #0ff; 
            font-family: 'Courier New', monospace; 
        }
        
        #bg-canvas { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: 0; 
            pointer-events: none;
        }
        
        .login-container { 
            position: relative; 
            z-index: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100%; 
            height: 100%; 
        }
        
        form { 
            background: rgba(10, 20, 20, 0.85);
            padding: 40px; 
            border: 2px solid #0ff; 
            border-radius: 12px; 
            width: 350px; 
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            text-align: center;
            z-index: 2;
        }
        
        h2 { margin-bottom: 25px; text-transform: uppercase; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px #0ff; }
        
        input { 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            background: rgba(0, 0, 0, 0.6); 
            border: 1px solid #0ff; 
            color: #fff; 
            font-size: 16px;
            border-radius: 4px;
            outline: none;
            display: block;
        }
        
        input:focus { border-color: #fff; box-shadow: 0 0 10px #0ff; }
        
        button { 
            width: 100%; 
            padding: 15px; 
            margin-top: 20px; 
            background: #0ff; 
            color: #000; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 16px;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        
        button:hover { background: #fff; box-shadow: 0 0 20px #0ff; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="login-container">
        <form>
            <h2>System Access</h2>
            <input type="text" placeholder="USER_ID" required>
            <input type="password" placeholder="ACCESS_KEY" required>
            <button type="submit">Authorize</button>
        </form>
    </div>
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = init;
        init();

        const columns = Math.floor(canvas.width / 20);
        const drops = Array(columns).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0ff';
            ctx.font = '15px monospace';
            for(let i = 0; i < drops.length; i++) {
                const text = String.fromCharCode(0x30A0 + Math.random() * 96);
                ctx.fillText(text, i * 20, drops[i] * 20);
                if(drops[i] * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 60);
    </script>
</body>
</html>
