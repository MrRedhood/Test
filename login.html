<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Login</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #050505; color: #0ff; font-family: 'Courier New', monospace; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
        .login-container { position: relative; z-index: 1; display: flex; justify-content: center; align-items: center; height: 100vh; }
        form { background: rgba(0, 20, 20, 0.8); padding: 40px; border: 1px solid #0ff; border-radius: 10px; width: 320px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); backdrop-filter: blur(10px); }
        h2 { text-align: center; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; text-shadow: 0 0 10px #0ff; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(0, 0, 0, 0.6); border: 1px solid #0ff; color: #0ff; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { box-shadow: 0 0 10px #0ff; }
        button { width: 100%; padding: 12px; margin-top: 15px; background: transparent; border: 1px solid #0ff; color: #0ff; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-weight: bold; }
        button:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="login-container">
        <form id="loginForm">
            <h2>System Access</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Authorize</button>
        </form>
    </div>
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const drops = Array(Math.floor(canvas.width / 20)).fill(0);
        function draw() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0ff';
            ctx.font = '15px monospace';
            drops.forEach((y, i) => {
                const text = String.fromCharCode(0x30A0 + Math.random() * 96);
                ctx.fillText(text, i * 20, y);
                if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i] += 20;
            });
        }
        setInterval(draw, 50);
    </script>
</body>
</html>
